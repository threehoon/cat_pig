services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_pet
      POSTGRES_PASSWORD: app_pet
      POSTGRES_DB: app_pet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/docker/initdb/01-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_pet -d app_pet"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
